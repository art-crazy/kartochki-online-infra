x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'
services:
  frontend:
    image: ghcr.io/art-crazy/kartochki-online-front:latest
    restart: unless-stopped
    logging: *id001
    env_file:
    - ./frontend.env
    expose:
    - '3000'
    networks:
      edge:
        aliases:
        - kartochki-web
  backend:
    image: ghcr.io/art-crazy/kartochki-online-backend:latest
    restart: unless-stopped
    logging: *id001
    env_file:
    - ./backend.env
    expose:
    - '8080'
    volumes:
    - backend-storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8080/health/live >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      edge:
        aliases:
        - kartochki-api
      data: {}
  migrate:
    image: ghcr.io/art-crazy/kartochki-online-backend:latest
    restart: 'no'
    logging: *id001
    env_file:
    - ./backend.env
    entrypoint:
    - /bin/sh
    - -c
    command:
    - /app/migrate -path /app/db/migrations -database "$$POSTGRES_DSN" up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - data
  blogsync:
    image: ghcr.io/art-crazy/kartochki-online-backend:latest
    restart: 'no'
    logging: *id001
    env_file:
    - ./backend.env
    entrypoint:
    - /app/blogsync
    command:
    - -dir
    - /app/content/blog
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - data
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *id001
    env_file:
    - ./postgres.env
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - data
  redis:
    image: redis:7
    restart: unless-stopped
    logging: *id001
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - data
volumes:
  postgres-data: null
  redis-data: null
  backend-storage: null
networks:
  edge:
    external: true
    name: edge_kartochki
  data:
    name: kartochki_data
    internal: true
