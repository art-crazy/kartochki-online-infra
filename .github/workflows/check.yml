name: Check backup scripts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: for file in scripts/*.sh; do bash -n "$file"; done
      - name: Check backup failure handling
        run: python3 tests/test-backups.py
      - name: Validate production Compose with example configuration
        run: |
          cp env/runtime.env.example .env
          cp env/postgres.env.example postgres.env
          cp env/backend.env.example backend.env
          cp env/frontend.env.example frontend.env
          docker compose -f docker-compose.prod.yml config --quiet
